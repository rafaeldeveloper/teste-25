<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teste-25</title>
<meta name="description" content="Página publicada com GitHub Pages">
<style>
:root {
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #59636e;
  --accent: #0969da;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #9198a1;
    --accent: #4493f8;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
}
main {
  flex: 1;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 64px 16px;
}
h1 { margin: 0 0 8px; font-size: 2rem; }
p { color: var(--muted); }
a { color: var(--accent); }
footer {
  padding: 24px 16px;
  text-align: center;
  font-size: 0.875rem;
  color: var(--muted);
}
</style>
</head>
<body>
<main>
  <h1>teste-25 mudei o nome</h1>
  <p>Página publicada com GitHub Pages.</p>
  <p><a href="https://github.com/rafaeldeveloper/teste-25">Ver repositório</a></p>
</main>
<footer>&copy; 2026 Rafael Costa</footer>
</body>
</html>
